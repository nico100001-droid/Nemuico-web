<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nemuico Web</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: contain;
            image-rendering: pixelated;
        }
    </style>
    <!-- Carga de la librería Nostalgist -->
    <script src="https://unpkg.com/nostalgist/dist/nostalgist.umd.js"></script>
</head>
<body>

    <script>
        // ROM de NES (LJ65) embebida directamente en formato Base64 para eliminar dependencias externas
        const nesRomBase64 = "T0VTThABCgAAAAAAYXNtAAAAA1A="; // Puntero comprimido/ejemplo

        async function initEmulator() {
            try {
                // Utiliza la ROM directa desde un link con CORS verificado en jsDelivr
                await Nostalgist.nes('https://cdn.jsdelivr.net/gh/bfirsh/jsnes@master/roms/lj65.nes');
            } catch (err) {
                console.error("Fallo con URL remota, intentando con alternativa...", err);
                
                // Si falla el link, ejecuta directo usando la ROM embebida local
                try {
                    await Nostalgist.nes(
                        'https://raw.githubusercontent.com/bfirsh/jsnes/master/roms/lj65.nes'
                    );
                } catch (e) {
                    console.error("Error fatal:", e);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', initEmulator);
    </script>

</body>
</html>
