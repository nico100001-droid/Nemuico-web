<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Emulador NES</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
        }

        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div id="game"></div>

    <script>
        EJS_player = "#game";

        // Sistema
        EJS_core = "nes";

        // ROM
        EJS_gameUrl = "https://github.com/retrobrews/nes-games/raw/refs/heads/master/invaders.nes";

        // Datos de EmulatorJS
        EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

        // Nombre del juego
        EJS_gameName = "NES Homebrew";

        // Iniciar automáticamente
        EJS_startOnLoaded = true;
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
