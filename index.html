<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Nemuico</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <!-- ========================= -->
    <!-- BIBLIOTECA -->
    <!-- ========================= -->

    <main id="biblioteca">

        <header class="encabezado">
            <h1>NEMUICO</h1>
            <p>Retro Game Collection</p>
        </header>


        <div class="sistemas">

            <!-- NES -->
            <section class="sistema">

                <h2>NES</h2>

                <div id="lista-nes" class="lista-juegos"></div>

            </section>


            <!-- SNES -->
            <section class="sistema">

                <h2>SNES</h2>

                <div id="lista-snes" class="lista-juegos"></div>

            </section>


            <!-- SEGA -->
            <section class="sistema">

                <h2>SEGA</h2>

                <div id="lista-sega" class="lista-juegos"></div>

            </section>

        </div>

    </main>


    <!-- ========================= -->
    <!-- EMULADOR -->
    <!-- ========================= -->

    <section id="pantalla-emulador">

        <!-- Botón cerrar -->
        <button
            id="boton-cerrar"
            aria-label="Cerrar juego"
            title="Cerrar juego">
            X
        </button>

        <!-- Nostalgist insertará su canvas aquí -->
        <div id="contenedor-emulador"></div>

    </section>


    <!-- ========================= -->
    <!-- MENSAJE DE CARGA -->
    <!-- ========================= -->

    <div id="cargando">

        <div class="cargando-contenido">

            <div class="spinner"></div>

            <div id="texto-cargando">
                Cargando juego...
            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->

    <script src="https://unpkg.com/nostalgist@0.21.1/dist/nostalgist.umd.js"></script>

    <script src="js/juegos.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
