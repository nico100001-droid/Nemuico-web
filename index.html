<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nemuico Web - NES</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
        }

        /*
         * Área del emulador.
         *
         * PRUEBA:
         * Limitamos la superficie a 1280x720.
         *
         * La TV 4K se encargará posteriormente
         * de escalar la imagen a pantalla completa.
         */
#game {
    width: 640px;
    height: 360px;

    margin: auto;
}
    </style>
</head>

<body>

    <div id="game"></div>

    <script>

        /*
         * Contenedor donde EmulatorJS se va a iniciar
         */
        EJS_player = "#game";


        /*
         * Núcleo de NES
         */
        EJS_core = "nes";


        /*
         * ROM
         *
         * Esta es la ROM homebrew que ya comprobamos
         * que funciona mediante raw.githubusercontent.com
         */
        EJS_gameUrl =
            "https://raw.githubusercontent.com/retrobrews/nes-games/master/jetpaco.nes";


        /*
         * Archivos de EmulatorJS
         */
        EJS_pathtodata =
            "https://cdn.emulatorjs.org/stable/data/";


        /*
         * Nombre mostrado por EmulatorJS
         */
        EJS_gameName = "Invaders";


        /*
         * Idioma
         *
         * es-AR no existe en el CDN de EmulatorJS.
         * Usamos español latinoamericano.
         */
        EJS_language = "es-419";


        /*
         * Arrancar automáticamente cuando
         * EmulatorJS termine de cargar.
         */
        EJS_startOnLoaded = true;

    </script>


    <!--
        Cargamos EmulatorJS
    -->
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>

</html>
