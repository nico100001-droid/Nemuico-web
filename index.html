<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nemuico Web</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Garantiza que el canvas del emulador ocupe toda la pantalla */
        canvas {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: contain;
            image-rendering: pixelated;
        }
    </style>
    <!-- Carga de Nostalgist desde CDN estable -->
    <script src="https://unpkg.com/nostalgist/dist/nostalgist.umd.js"></script>
</head>
<body>

    <script>
        async function launchGame() {
            try {
                // Configuramos Nostalgist usando la CDN de unpkg directamente
                await Nostalgist.launch({
                    core: 'fceumm',
                    rom: 'https://tomiaa12.github.io/nesRoms/nes/543.nes',
                    // CDN pública estable con los archivos WebAssembly precompilados de RetroArch
                    cdn: 'https://unpkg.com/@retroarch/emulatorjs@latest/dist/'
                });
            } catch (error) {
                console.error("Error iniciando el emulador:", error);
            }
        }

        // Ejecutar al cargar la página
        window.addEventListener('DOMContentLoaded', launchGame);
    </script>

</body>
</html>
